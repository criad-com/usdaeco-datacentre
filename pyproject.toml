[project]
name = "dcbuild"
version = "0.4.8"
description = "demo-datacentre-01 — a full data centre authored programmatically, twice: ifcopenshell and Revit, from one parametric spec"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "usdaeco-revit>=0.1,<0.2",
    "ifcopenshell>=0.8.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "usd-core>=26.8",
    "pillow>=12",
    "pytest>=8.0",  # ifcopenshell.validate's express-rule executor imports _pytest
]

[project.scripts]
dcbuild = "dcbuild.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcbuild"]

[tool.pytest.ini_options]
testpaths = ["tests"]
