# spec class -> ordered candidate Revit family names (best-effort guesses for
# the stock metric template + MEP library). Every entry is OPTIONAL: the C#
# (40_equipment.csx) tries each candidate against loaded symbols, then the
# RVT 2027 library on disk, and falls back to a DirectShape box/cylinder of the
# planned size -- so wrong guesses are safe, they just cost a lookup.
#
# PARSER CONTRACT (40_equipment.csx reads this file from AECO_REVIT_WORKDIR / families.yaml,
# uploaded by driver.py): block style ONLY --
#   cls:
#     - Family Name
# No inline [a, b] lists, no '#' inside names, no nesting.

utility_intake:         # no candidates: always DirectShape

rmu:
  - Utility Switchboard
  - Circuit Breaker Switchboard
  - Ring Main Unit
  - M_Switchboard
