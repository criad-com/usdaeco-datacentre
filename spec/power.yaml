# demo-datacentre-01 electrical design: full 2N topology. Two fully-independent power trains
# (side A west, side B east) from utility intake to rack; each train is sized to
# carry the entire facility alone. Node positions are equipment centres in metres.
#
# Node classes map to IFC4X3 / Revit categories in the builders:
#   utility_intake -> IfcBuildingElementProxy (grid connection point)
#   rmu            -> IfcElectricDistributionBoard/SWITCHBOARD (11 kV ring main unit)
#   transformer    -> IfcTransformer/CURRENT
#   generator      -> IfcElectricGenerator/STANDALONE (diesel standby)
#   fuel_tank      -> IfcTank/STORAGE
#   msb            -> IfcElectricDistributionBoard/SWITCHBOARD (main LV board)
#   ups            -> IfcElectricFlowStorageDevice/UPS
#   battery        -> IfcElectricFlowStorageDevice/BATTERY (battery string)
#   uob            -> IfcElectricDistributionBoard/SWITCHBOARD (UPS output board)
#   pdu            -> IfcElectricDistributionBoard/DISTRIBUTIONBOARD
#   mcc            -> IfcElectricDistributionBoard/MOTORCONTROLCENTRE (mechanical loads)
#   hdb            -> IfcElectricDistributionBoard/DISTRIBUTIONBOARD (house/office)
#
# The edge list is the electrical one-line. kind: hv_cable | lv_cable | busway_feed.
# Rack feeds (rack -> row busway A + row busway B) are GENERATED by dcbuild.layout
# from spec/it.yaml, not listed here.

sides: [A, B]

capacity_kw:
  it_load: 2800          # Hall A 2000 + Hall B 800 (checked against it.yaml by QA)
  mech_load: 600
  house_load: 200

nodes:
  # ---- Side A (west) ------------------------------------------------------
  - {id: pwr.util.a, class: utility_intake, name: "UTIL-A", side: A, space: EXT, pad: pad.gen.a, pos: [-13.0, 4.0, 0.0], rating_kva: 5000}
  - {id: pwr.rmu.a,  class: rmu,         name: "RMU-A",  side: A, space: sp.elec.a, pos: [1.5, 13.5, 0.0], rating_kva: 5000, voltage: "11kV"}
  - {id: pwr.tx.a,   class: transformer, name: "TX-A",   side: A, space: EXT, pad: pad.gen.a, pos: [-6.0, 12.0, 0.0], rating_kva: 5000, voltage: "11kV/400V"}
  - {id: pwr.gen.a,  class: generator,   name: "GEN-A",  side: A, space: EXT, pad: pad.gen.a, pos: [-10.0, 6.0, 0.0], rating_kva: 5000, fuel: diesel}
  - {id: pwr.fuel.a, class: fuel_tank,   name: "FT-A",   side: A, space: EXT, pad: pad.gen.a, pos: [-12.5, 12.0, 0.0], volume_l: 20000}
  - {id: pwr.msb.a,  class: msb,         name: "MSB-A",  side: A, space: sp.elec.a, pos: [6.0, 13.5, 0.0], rating_kva: 5000}
  - {id: pwr.ups.a1, class: ups, name: "UPS-A1", side: A, space: sp.elec.a, pos: [1.5, 10.5, 0.0], rating_kw: 800}
  - {id: pwr.ups.a2, class: ups, name: "UPS-A2", side: A, space: sp.elec.a, pos: [3.5, 10.5, 0.0], rating_kw: 800}
  - {id: pwr.ups.a3, class: ups, name: "UPS-A3", side: A, space: sp.elec.a, pos: [5.5, 10.5, 0.0], rating_kw: 800}
  - {id: pwr.ups.a4, class: ups, name: "UPS-A4", side: A, space: sp.elec.a, pos: [7.5, 10.5, 0.0], rating_kw: 800}
  - {id: pwr.bat.a1, class: battery, name: "BAT-A1", side: A, space: sp.batt.a, pos: [1.5, 3.0, 0.0], rating_kwh: 267}
  - {id: pwr.bat.a2, class: battery, name: "BAT-A2", side: A, space: sp.batt.a, pos: [3.5, 3.0, 0.0], rating_kwh: 267}
  - {id: pwr.bat.a3, class: battery, name: "BAT-A3", side: A, space: sp.batt.a, pos: [5.5, 3.0, 0.0], rating_kwh: 267}
  - {id: pwr.bat.a4, class: battery, name: "BAT-A4", side: A, space: sp.batt.a, pos: [7.5, 3.0, 0.0], rating_kwh: 267}
  - {id: pwr.uob.a,  class: uob, name: "UOB-A", side: A, space: sp.elec.a, pos: [6.0, 8.0, 0.0], rating_kva: 4000}
  - {id: pwr.mcc.a,  class: mcc, name: "MCC-A", side: A, space: sp.elec.a, pos: [10.0, 13.5, 0.0], rating_kva: 800}
  - {id: pwr.hdb.a,  class: hdb, name: "HDB-A", side: A, space: sp.elec.a, pos: [10.5, 10.5, 0.0], rating_kva: 250}

  # ---- Side B (east; mirror of A about x = 36) ----------------------------
  - {id: pwr.util.b, class: utility_intake, name: "UTIL-B", side: B, space: EXT, pad: pad.gen.b, pos: [85.0, 4.0, 0.0], rating_kva: 5000}
  - {id: pwr.rmu.b,  class: rmu,         name: "RMU-B",  side: B, space: sp.elec.b, pos: [70.5, 13.5, 0.0], rating_kva: 5000, voltage: "11kV"}
  - {id: pwr.tx.b,   class: transformer, name: "TX-B",   side: B, space: EXT, pad: pad.gen.b, pos: [78.0, 12.0, 0.0], rating_kva: 5000, voltage: "11kV/400V"}
  - {id: pwr.gen.b,  class: generator,   name: "GEN-B",  side: B, space: EXT, pad: pad.gen.b, pos: [82.0, 6.0, 0.0], rating_kva: 5000, fuel: diesel}
  - {id: pwr.fuel.b, class: fuel_tank,   name: "FT-B",   side: B, space: EXT, pad: pad.gen.b, pos: [84.5, 12.0, 0.0], volume_l: 20000}
  - {id: pwr.msb.b,  class: msb,         name: "MSB-B",  side: B, space: sp.elec.b, pos: [66.0, 13.5, 0.0], rating_kva: 5000}
  - {id: pwr.ups.b1, class: ups, name: "UPS-B1", side: B, space: sp.elec.b, pos: [64.5, 10.5, 0.0], rating_kw: 800}
  - {id: pwr.ups.b2, class: ups, name: "UPS-B2", side: B, space: sp.elec.b, pos: [66.5, 10.5, 0.0], rating_kw: 800}
  - {id: pwr.ups.b3, class: ups, name: "UPS-B3", side: B, space: sp.elec.b, pos: [68.5, 10.5, 0.0], rating_kw: 800}
  - {id: pwr.ups.b4, class: ups, name: "UPS-B4", side: B, space: sp.elec.b, pos: [70.5, 10.5, 0.0], rating_kw: 800}
  - {id: pwr.bat.b1, class: battery, name: "BAT-B1", side: B, space: sp.batt.b, pos: [64.5, 3.0, 0.0], rating_kwh: 267}
  - {id: pwr.bat.b2, class: battery, name: "BAT-B2", side: B, space: sp.batt.b, pos: [66.5, 3.0, 0.0], rating_kwh: 267}
  - {id: pwr.bat.b3, class: battery, name: "BAT-B3", side: B, space: sp.batt.b, pos: [68.5, 3.0, 0.0], rating_kwh: 267}
  - {id: pwr.bat.b4, class: battery, name: "BAT-B4", side: B, space: sp.batt.b, pos: [70.5, 3.0, 0.0], rating_kwh: 267}
  - {id: pwr.uob.b,  class: uob, name: "UOB-B", side: B, space: sp.elec.b, pos: [66.0, 8.0, 0.0], rating_kva: 4000}
  - {id: pwr.mcc.b,  class: mcc, name: "MCC-B", side: B, space: sp.elec.b, pos: [62.0, 13.5, 0.0], rating_kva: 800}
  - {id: pwr.hdb.b,  class: hdb, name: "HDB-B", side: B, space: sp.elec.b, pos: [61.5, 10.5, 0.0], rating_kva: 250}

# PDUs are generated per hall row per side by dcbuild.layout (8 rows x 2 sides = 16):
#   id pattern: pwr.pdu.{side}.{hall}{row}   e.g. pwr.pdu.a.a1, pwr.pdu.b.b4
#   Side A PDUs sit at the WEST end of each row, side B at the EAST end.
#   Hall A row PDUs 630 kVA, Hall B row PDUs 250 kVA.
pdu_rules:
  hall.a: {rating_kva: 630, offset_from_row_end: 1.6}
  hall.b: {rating_kva: 250, offset_from_row_end: 1.6}

edges:
  # Side A one-line
  - {from: pwr.util.a, to: pwr.rmu.a,  kind: hv_cable}
  - {from: pwr.rmu.a,  to: pwr.tx.a,   kind: hv_cable}
  - {from: pwr.tx.a,   to: pwr.msb.a,  kind: lv_cable}
  - {from: pwr.gen.a,  to: pwr.msb.a,  kind: lv_cable}
  - {from: pwr.fuel.a, to: pwr.gen.a,  kind: fuel_line}
  - {from: pwr.msb.a,  to: pwr.ups.a1, kind: lv_cable}
  - {from: pwr.msb.a,  to: pwr.ups.a2, kind: lv_cable}
  - {from: pwr.msb.a,  to: pwr.ups.a3, kind: lv_cable}
  - {from: pwr.msb.a,  to: pwr.ups.a4, kind: lv_cable}
  - {from: pwr.bat.a1, to: pwr.ups.a1, kind: dc_cable}
  - {from: pwr.bat.a2, to: pwr.ups.a2, kind: dc_cable}
  - {from: pwr.bat.a3, to: pwr.ups.a3, kind: dc_cable}
  - {from: pwr.bat.a4, to: pwr.ups.a4, kind: dc_cable}
  - {from: pwr.ups.a1, to: pwr.uob.a,  kind: lv_cable}
  - {from: pwr.ups.a2, to: pwr.uob.a,  kind: lv_cable}
  - {from: pwr.ups.a3, to: pwr.uob.a,  kind: lv_cable}
  - {from: pwr.ups.a4, to: pwr.uob.a,  kind: lv_cable}
  - {from: pwr.msb.a,  to: pwr.mcc.a,  kind: lv_cable}
  - {from: pwr.msb.a,  to: pwr.hdb.a,  kind: lv_cable}

  # Side B one-line
  - {from: pwr.util.b, to: pwr.rmu.b,  kind: hv_cable}
  - {from: pwr.rmu.b,  to: pwr.tx.b,   kind: hv_cable}
  - {from: pwr.tx.b,   to: pwr.msb.b,  kind: lv_cable}
  - {from: pwr.gen.b,  to: pwr.msb.b,  kind: lv_cable}
  - {from: pwr.fuel.b, to: pwr.gen.b,  kind: fuel_line}
  - {from: pwr.msb.b,  to: pwr.ups.b1, kind: lv_cable}
  - {from: pwr.msb.b,  to: pwr.ups.b2, kind: lv_cable}
  - {from: pwr.msb.b,  to: pwr.ups.b3, kind: lv_cable}
  - {from: pwr.msb.b,  to: pwr.ups.b4, kind: lv_cable}
  - {from: pwr.bat.b1, to: pwr.ups.b1, kind: dc_cable}
  - {from: pwr.bat.b2, to: pwr.ups.b2, kind: dc_cable}
  - {from: pwr.bat.b3, to: pwr.ups.b3, kind: dc_cable}
  - {from: pwr.bat.b4, to: pwr.ups.b4, kind: dc_cable}
  - {from: pwr.ups.b1, to: pwr.uob.b,  kind: lv_cable}
  - {from: pwr.ups.b2, to: pwr.uob.b,  kind: lv_cable}
  - {from: pwr.ups.b3, to: pwr.uob.b,  kind: lv_cable}
  - {from: pwr.ups.b4, to: pwr.uob.b,  kind: lv_cable}
  - {from: pwr.msb.b,  to: pwr.mcc.b,  kind: lv_cable}
  - {from: pwr.msb.b,  to: pwr.hdb.b,  kind: lv_cable}

# UOB -> PDU feeders and PDU -> busway -> rack connections are generated by layout.
# Mechanical equipment power assignments (single-corded, alternated A/B for
# diversity within N+1 groups; QA checks no redundancy group is all-one-side):
mech_feeds:
  pwr.mcc.a: [clg.fwp.1, clg.drc.1, clg.drc.2, clg.ch.1, clg.cdu.a1, clg.cdu.a2, clg.crah.b1, clg.crah.b2, clg.crah.b3, clg.chp.1, clg.dos.1]
  pwr.mcc.b: [clg.fwp.2, clg.fwp.3, clg.drc.3, clg.drc.4, clg.ch.2, clg.cdu.a3, clg.cdu.a4, clg.crah.b4, clg.crah.b5, clg.crah.b6, clg.chp.2, clg.chp.3, clg.ahu.1]

busway:
  # One busway pair (A + B) above every rack row; generated per row by layout.
  z: 3.4                # underside height above FFL
  y_offset: {A: -0.35, B: 0.35}    # either side of the rack row centreline
  rating_a: {hall.a: 1000, hall.b: 500}  # amps (row demand @ 400 V 3ph 0.9 pf + margin)
