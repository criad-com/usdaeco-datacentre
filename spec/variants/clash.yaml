# Exact IFC circles stay unchanged; publication controls only tessellation.
extends: pod
publication:
  tessellation:
    pipe.clash.near:
      mode: inscribed
      deflection: 0.006
      vertex_direction: [0, 0, -1]
    pipe.clash.tangent:
      mode: circumscribed
      deflection: 0.0012
      vertex_direction: [0, -1, 0]
fitout:
  elements:
  - id: pipe.clash.hard
    name: pipe.clash.hard
    ifc_class: IfcPipeSegment
    predefined: RIGIDSEGMENT
    space: sp.void.ocorr.1
    axis: &id007
    - &id001
      - 24
      - -4
      - 6.8
    - &id002
      - 24
      - -2
      - 6.8
    od: 0.0603
    nominal_diameter: 0.05
    port_system: CHILLEDWATER
    port_medium: PIPE
    ports:
    - *id001
    - *id002
  - id: pipe.clash.near
    name: pipe.clash.near
    ifc_class: IfcPipeSegment
    predefined: RIGIDSEGMENT
    space: sp.void.ocorr.1
    axis: &id008
    - &id003
      - 23
      - -1.5
      - 6.88515
    - &id004
      - 25
      - -1.5
      - 6.88515
    od: 0.0603
    nominal_diameter: 0.05
    port_system: CHILLEDWATER
    port_medium: PIPE
    ports:
    - *id003
    - *id004
  - id: pipe.clash.tangent
    name: pipe.clash.tangent
    ifc_class: IfcPipeSegment
    predefined: RIGIDSEGMENT
    space: sp.void.ocorr.1
    axis: &id010
    - &id005
      - 23
      - -2.89485
      - 6.8
    - &id006
      - 25
      - -2.89485
      - 6.8
    od: 0.0603
    nominal_diameter: 0.05
    port_system: CHILLEDWATER
    port_medium: PIPE
    ports:
    - *id005
    - *id006
expected:
  clash:
  - id: pipe.clash.hard
    partner: wall.l1.h.007
    axis: *id007
    od: 0.0603
    wall_face_plane: &id009
      normal:
      - 0
      - 1
      - 0
      offset: -2.925
      wall: wall.l1.h.007
      axis_y: -3
      thickness: 0.15
    exact:
      verdict: hard
    mesh:
      verdict: hard
  - id: pipe.clash.near
    partner: tray.void.ocorr.1
    axis: *id008
    od: 0.0603
    wall_face_plane: *id009
    exact:
      verdict: clearance
      distance: 0.005
    mesh:
      verdict: undecidable
      combined_deflection_band: 0.0057582
    overlap: 2
    tray_top: 6.85
  - id: pipe.clash.tangent
    partner: wall.l1.h.007
    axis: *id010
    od: 0.0603
    wall_face_plane: *id009
    exact:
      verdict: touching
      distance: 0
    mesh:
      verdict: falsePenetration
      minimum_penetration: 0.0005
      combined_deflection_band: 0.0010636
